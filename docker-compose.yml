name: polls-platform

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: polls
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polls"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  poll-service:
    build: ./poll-service
    ports:
      - "8001:8001"
    environment:
      DB_URL: ${POLL_DB_URL:-jdbc:postgresql://db:5432/polls?currentSchema=poll}
      DB_USER: ${POLL_DB_USER:-poll}
      DB_PASSWORD: ${POLL_DB_PASSWORD:-poll_pass}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  vote-service:
    build: ./vote-service
    ports:
      - "8002:8002"
    environment:
      DB_URL: ${VOTE_DB_URL:-jdbc:postgresql://db:5432/polls?currentSchema=vote}
      DB_USER: ${VOTE_DB_USER:-vote}
      DB_PASSWORD: ${VOTE_DB_PASSWORD:-vote_pass}
      POLL_SERVICE_URL: ${POLL_SERVICE_URL:-http://poll-service:8001}
      HTTP_CONNECT_TIMEOUT_MS: ${HTTP_CONNECT_TIMEOUT_MS:-3000}
      HTTP_READ_TIMEOUT_MS: ${HTTP_READ_TIMEOUT_MS:-3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  results-service:
    build: ./results-service
    ports:
      - "8003:8003"
    environment:
      POLL_SERVICE_URL: ${POLL_SERVICE_URL:-http://poll-service:8001}
      VOTE_SERVICE_URL: ${VOTE_SERVICE_URL:-http://vote-service:8002}
      HTTP_CONNECT_TIMEOUT_MS: ${HTTP_CONNECT_TIMEOUT_MS:-3000}
      HTTP_READ_TIMEOUT_MS: ${HTTP_READ_TIMEOUT_MS:-3000}
    depends_on:
      poll-service:
        condition: service_healthy
      vote-service:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  app_net:
    driver: bridge

volumes:
  db_data:
