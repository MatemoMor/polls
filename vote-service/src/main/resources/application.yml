server:
  port: 8002

spring:
  application:
    name: vote-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/polls?currentSchema=vote}
    username: ${DB_USER:vote}
    password: ${DB_PASSWORD:vote_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: vote
  flyway:
    enabled: true
    schemas: vote
    default-schema: vote
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health

app:
  poll-service-url: ${POLL_SERVICE_URL:http://localhost:8001}
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:3000}
